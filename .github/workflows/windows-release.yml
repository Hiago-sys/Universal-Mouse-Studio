name: Build Windows e download
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar e executar testes
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Publicar Windows x64 com runtime
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Preparar pacote completo e checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/downloads | Out-Null
          git archive --format=zip --prefix=UniversalMouseStudio/ HEAD -o artifacts/downloads/UniversalMouseStudio-source.zip
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao arquivar os fontes.' }
          Expand-Archive artifacts/downloads/UniversalMouseStudio-source.zip artifacts/complete
          $target = 'artifacts/complete/UniversalMouseStudio/artifacts/portable-win-x64'
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item artifacts/portable-win-x64/* $target -Recurse -Force
          Compress-Archive artifacts/complete/UniversalMouseStudio artifacts/downloads/UniversalMouseStudio-completo.zip
          Copy-Item artifacts/UniversalMouseStudio-win-x64.zip artifacts/downloads/
          Get-ChildItem artifacts/downloads/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/downloads/SHA256SUMS.txt -Encoding utf8
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path artifacts/downloads/UniversalMouseStudio-completo.zip))
          try {
            foreach ($required in @('UniversalMouseStudio/UniversalMouseStudio.sln', 'UniversalMouseStudio/artifacts/portable-win-x64/UniversalMouseStudio.exe')) {
              if (-not ($archive.Entries | Where-Object { $_.FullName.Replace('\','/') -eq $required })) { throw "Arquivo ausente: $required" }
            }
          } finally { $archive.Dispose() }
      - name: Guardar artefatos de build
        uses: actions/upload-artifact@v4
        with:
          name: UniversalMouseStudio-downloads
          path: artifacts/downloads/*
          if-no-files-found: error
      - name: Publicar links diretos para download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.1-build.$env:GITHUB_RUN_NUMBER"
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag artifacts/downloads/* --clobber
          } else {
            gh release create $tag artifacts/downloads/* --target $env:GITHUB_SHA --title "Universal Mouse Studio 0.1.1 — build $env:GITHUB_RUN_NUMBER" --notes-file docs/RELEASE_NOTES.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha na publicação da Release.' }
